name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify TenAgent Scripts & Engines
        run: |
          python -m py_compile council.py stream.py swarm_pipeline.py dashboard/serve.py dashboard/security.py dashboard/statefile.py setup_project.py

      - name: Test (platform-independent; the HTTP integration tests skip here)
        run: python -I -m unittest discover -s tests -v

      - name: Validate Swarm State & Specification Integrity
        run: |
          python -c "import json; json.load(open('specs/swarm-status.json')); json.load(open('specs/swarm-config.example.json'))"
          python -c "import council; print('Providers supported:', list(council.PROVIDER_PROFILES.keys()))"

  dashboard-http-tests:
    # dashboard/serve.py is Windows-only; this job runs the real-HTTP tests.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test (including the HTTP integration tests)
        run: python -I -m unittest discover -s tests -v
