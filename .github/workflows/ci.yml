name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify TenAgent Scripts & Engines
        run: |
          python -m py_compile council.py stream.py swarm_pipeline.py dashboard/serve.py setup_project.py

      - name: Validate Swarm State & Specification Integrity
        run: |
          python -c "import json; json.load(open('specs/swarm-status.json')); json.load(open('specs/swarm-config.example.json'))"
          python -c "import council; print('Providers supported:', list(council.PROVIDER_PROFILES.keys()))"
